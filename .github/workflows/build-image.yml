name: Build and push LichtFeld Studio image

# Manual trigger by default (this is a ~60-90 min compile - not something
# that should fire on every push by accident). Also runs automatically if
# you edit the Dockerfile/scripts themselves.
on:
  workflow_dispatch:
    inputs:
      lfs_ref:
        description: "LichtFeld-Studio git ref to build (branch, tag, or commit SHA)"
        required: false
        default: "master"
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "start.sh"
      - "lichtfeld-headless"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's free runners are 2-core - compiling LichtFeld's CUDA/vcpkg
    # dependency tree here will likely take longer wall-clock than it would
    # on a beefier RunPod pod. That's the trade you're making for it being
    # free instead of costing paid GPU-hours; layer caching below (cache-from
    # /cache-to: type=gha) means only the FIRST build pays this in full -
    # later rebuilds (e.g. bumping lfs_ref) reuse unchanged layers.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            LFS_REF=${{ github.event.inputs.lfs_ref || 'master' }}
          tags: |
            dakord/lichtfeld-studio:latest
            dakord/lichtfeld-studio:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
