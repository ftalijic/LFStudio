name: Build and push LichtFeld Studio image

on:
  workflow_dispatch:
    inputs:
      lfs_ref:
        description: "LichtFeld-Studio git ref to build (branch, tag, or commit SHA)"
        required: false
        default: "master"
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "start.sh"
      - "lichtfeld-headless"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN as env vars so the
      # Docker build below can hand them to vcpkg. Without this, vcpkg has
      # no persistent cache and a mid-install failure (like the automake
      # 502 we just hit) means the NEXT run rebuilds every already-succeeded
      # package from source too - this is what fixes that.
      - name: Export GitHub Actions cache variables
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LFS_REF=${{ github.event.inputs.lfs_ref || 'master' }}
          secrets: |
            "actions_cache_url=${{ env.ACTIONS_CACHE_URL }}"
            "actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}"
          tags: |
            dakord/lichtfeld-studio:latest
            dakord/lichtfeld-studio:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
